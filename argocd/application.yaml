---
# This file is the canonical reference. The live copy lives at:
# mosher-labs/homelab-gitops: apps/book-review-publisher/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-review-publisher
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Sealed secret (github-pat) — lives in homelab-gitops, sync-wave -1
    - repoURL: https://github.com/Mosher-Labs/homelab-gitops.git
      targetRevision: main
      path: apps/book-review-publisher/manifests
    # App manifests: Deployment, Service, Ingress
    - repoURL: https://github.com/Mosher-Labs/book-review-publisher.git
      targetRevision: main
      path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: book-review-publisher
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
