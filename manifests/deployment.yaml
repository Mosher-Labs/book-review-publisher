---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-review-publisher
  namespace: book-review-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: book-review-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: book-review-publisher
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: book-review-publisher
          image: ghcr.io/mosher-labs/book-review-publisher:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: book-review-publisher-secrets
                  key: github-pat
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: book-review-publisher-auth
                  key: auth-token
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: book-review-publisher-auth
                  key: oauth-client-id
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.3
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(CF_TOKEN)
          env:
            - name: CF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-credentials
                  key: tunnel-token
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
