---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-review-publisher
  namespace: book-review-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: book-review-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: book-review-publisher
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: book-review-publisher
          image: ghcr.io/mosher-labs/book-review-publisher:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: book-review-publisher-secrets
                  key: github-pat
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
