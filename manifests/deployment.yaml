---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-review-publisher
  namespace: book-review-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: book-review-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: book-review-publisher
      annotations:
        # OpenTelemetry Go auto-instrumentation (homelab-gitops#153): the
        # operator adds an eBPF sidecar that turns this binary's HTTP
        # requests into traces, and the collector into request metrics.
        instrumentation.opentelemetry.io/inject-go: "opentelemetry/default"
        instrumentation.opentelemetry.io/otel-go-auto-target-exe: /usr/local/bin/book-review-publisher
    spec:
      # Non-root is set on the app container, not here: the injected eBPF
      # sidecar has to run as root.
      securityContext:
        fsGroup: 1000
      containers:
        - name: book-review-publisher
          image: ghcr.io/mosher-labs/book-review-publisher:latest@sha256:9df9c8cac4abebbef89d832980137dcb2f014bad2af4aac208272894e1548315
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: book-review-publisher-secrets
                  key: github-pat
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: book-review-publisher-auth
                  key: auth-token
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: book-review-publisher-auth
                  key: oauth-client-id
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(CF_TOKEN)
          env:
            - name: CF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-credentials
                  key: tunnel-token
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
